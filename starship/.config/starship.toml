"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 700
scan_timeout = 30
palette = "catppuccin_mocha"

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$fill\
$status\
$nodejs\
$ruby\
$python\
$golang\
$rust\
$php\
$cmd_duration\
$jobs\
$time\
$line_break\
$character"""

[fill]
symbol = " "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold blue)"
vimcmd_replace_one_symbol = "[❮](bold mauve)"
vimcmd_replace_symbol = "[❮](bold mauve)"
vimcmd_visual_symbol = "[❮](bold yellow)"

[username]
format = "[$user]($style)[@](overlay0)"
style_user = "bold lavender"
style_root = "bold red"
show_always = false

[hostname]
format = "[$hostname]($style) "
style = "bold lavender"
ssh_only = true

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold blue"
read_only = " 󰌾"
read_only_style = "red"
truncation_length = 4
truncation_symbol = "…/"
home_symbol = "~"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Developer" = "󰲋 "
"Projects" = "󰲋 "

[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "
symbol = " "
style = "mauve"
truncation_length = 32
truncation_symbol = "…"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "peach"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked = "?${count}"
stashed = "$${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "✘ "
style = "red"

[cmd_duration]
min_time = 1000
format = "[󱎫 $duration]($style) "
style = "peach"
show_milliseconds = false

[jobs]
format = "[$symbol$number]($style) "
symbol = "󰜎 "
style = "yellow"
number_threshold = 1

[time]
disabled = false
format = "[$time]($style)"
style = "overlay0"
time_format = "%H:%M"

[nodejs]
format = "[$symbol($version)]($style) "
symbol = "󰎙 "
style = "green"

[ruby]
format = "[$symbol($version)]($style) "
symbol = " "
style = "red"

[python]
format = "[$symbol($version)( \\($virtualenv\\))]($style) "
symbol = " "
style = "yellow"

[golang]
format = "[$symbol($version)]($style) "
symbol = " "
style = "sky"

[rust]
format = "[$symbol($version)]($style) "
symbol = " "
style = "peach"

[php]
format = "[$symbol($version)]($style) "
symbol = " "
style = "lavender"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
